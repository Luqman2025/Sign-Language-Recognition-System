import java.util.Properties

plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 34
    buildToolsVersion "30.0.2"

    defaultConfig {
        applicationId "com.example.imagepro"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        def envFile = rootProject.file(".env")
        def envProps = new Properties()
        if (envFile.exists()) {
            envFile.withInputStream { stream ->
                envProps.load(stream)
            }
        }

        buildConfigField "String", "SMTP_HOST", "\"${envProps.getProperty('SMTP_HOST', 'smtp.gmail.com')}\""
        buildConfigField "String", "SMTP_PORT", "\"${envProps.getProperty('SMTP_PORT', '587')}\""
        buildConfigField "String", "SMTP_USERNAME", "\"${envProps.getProperty('SMTP_USERNAME', '')}\""
        buildConfigField "String", "SMTP_PASSWORD", "\"${envProps.getProperty('SMTP_PASSWORD', '')}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    configurations.all {
        resolutionStrategy {
            // Exclude the conflicting dependency
            subprojects {
                all { subproject ->
                    if (subproject.name.contains('browser')) {
                        subproject.configurations.all {
                            exclude group: 'com.android.build', module: 'gradle'
                        }
                    }
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jni {
                srcDirs 'src\\main\\jni', 'src\\main\\jnilibs'
            }
        }
    }

    aaptOptions {
        noCompress "tflite"
        noCompress "lite"
    }
    buildFeatures {
        viewBinding true

//        mlModelBinding true
    }
}

dependencies {

    // ✅ TensorFlow (UNCHANGED)
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.1.0-rc1'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.2.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.1.0'
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.1.0'
    implementation 'org.tensorflow:tensorflow-lite-task-text:0.1.0'

    // ✅ AndroidX (unchanged)
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // ✅ OpenCV
    implementation project(path: ':openCVLibrary3413')

    // 🔥 Firebase (FIXED using BOM)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'

    // 🧪 Testing (kept mostly same, just stable junit)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    // 📧 Mail
    implementation 'com.sun.mail:android-mail:1.6.5'

    // 🖼️ Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // 🎥 YouTube Player (FIXED)
    implementation "com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.0"
}